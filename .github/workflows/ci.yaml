name: CI Pipeline

on: push 


jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps: 
      - name: code checkout
        uses: actions/checkout@v3
  
      - name: setup python 
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: run DVC Pipeline
        env:
          DAGSHUB_PAT: ${{ secrets.DA   GSHUB_PAT }}
        run: |
          dvc repro